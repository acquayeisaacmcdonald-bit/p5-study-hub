<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riddles — Study Hub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .riddle-hero { padding: 60px 20px 30px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15), transparent 60%); }
    .riddle-hero .riddle-badge { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(168,85,247,0.2); border: 1px solid rgba(168,85,247,0.4); color: #c084fc; font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
    .riddle-hero h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 12px; }
    .riddle-hero p { font-size: 1.05rem; color: rgba(255,255,255,0.75); max-width: 600px; margin: 0 auto; line-height: 1.6; }

    .class-filter { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 20px; max-width: 900px; margin: 0 auto; }
    .class-chip { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .class-chip:hover { background: rgba(255,255,255,0.14); }
    .class-chip.active { background: #a855f7; border-color: #a855f7; }

    .riddle-grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 20px; }
    @media (min-width: 600px) { .riddle-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 900px) { .riddle-grid { grid-template-columns: 1fr 1fr 1fr; } }

    .riddle-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 20px; cursor: pointer; transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column; }
    .riddle-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.1); border-color: #a855f7; }
    .riddle-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .riddle-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
    .riddle-meta { font-size: 0.75rem; color: rgba(255,255,255,0.55); display: flex; gap: 10px; flex-wrap: wrap; }
    .riddle-class-tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; background: rgba(168,85,247,0.2); color: #c084fc; font-weight: 700; text-transform: uppercase; }

    .riddle-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 200; display: none; overflow-y: auto; padding: 20px 0; }
    .riddle-viewer.open { display: block; }
    .riddle-viewer-card { background: linear-gradient(135deg, #4c1d95, #1e1b4b); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; max-width: 600px; margin: 0 auto; padding: 30px; position: relative; text-align: center; }
    .riddle-viewer-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    .riddle-question { font-size: 1.4rem; font-weight: 700; line-height: 1.5; margin: 20px 0 30px; color: #facc15; }
    .reveal-btn { padding: 14px 28px; border-radius: 12px; border: none; background: #facc15; color: #0f172a; font-weight: 800; font-size: 1rem; cursor: pointer; font-family: inherit; transition: background 0.2s; }
    .reveal-btn:hover { background: #eab308; }
    .riddle-answer { margin-top: 24px; padding: 20px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 14px; font-size: 1.05rem; line-height: 1.6; display: none; }
    .riddle-answer.show { display: block; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <a href="profile-picker.html" class="site-logo">
        <span class="site-logo-icon">📚</span>
        <span class="site-logo-text"><strong>Study Hub</strong><small>Riddles</small></span>
      </a>
      <div class="site-header-actions">
        <a href="profile-picker.html" class="site-header-cta">← Home</a>
      </div>
    </div>
  </header>

  <section class="riddle-hero">
    <div class="riddle-badge">🧩 Riddles</div>
    <h1>Ghanaian Riddles</h1>
    <p>Test your brain! Click a riddle, guess the answer, then reveal it.</p>
  </section>

  <div class="class-filter" id="classFilter"></div>

  <main>
    <div class="riddle-grid" id="riddleGrid"></div>
  </main>

  <div class="riddle-viewer" id="riddleViewer">
    <div class="riddle-viewer-card">
      <button class="riddle-viewer-close" onclick="closeRiddle()">✕</button>
      <div class="riddle-question" id="viewerQuestion"></div>
      <button class="reveal-btn" id="revealBtn" onclick="revealAnswer()">🔍 Reveal Answer</button>
      <div class="riddle-answer" id="viewerAnswer"></div>
    </div>
  </div>

  <script>
    const CLASSES = [
      { id: "all", label: "All" },
      { id: "p1", label: "P1" },
      { id: "p2", label: "P2" },
      { id: "p3", label: "P3" },
      { id: "p4", label: "P4" },
      { id: "p5", label: "P5" },
      { id: "p6", label: "P6" },
      { id: "jhs1", label: "JHS 1" },
      { id: "jhs2", label: "JHS 2" },
      { id: "jhs3", label: "JHS 3" }
    ];

    let allRiddles = [];
    let activeFilter = "all";
    let currentRiddle = null;

    async function loadRiddles() {
      try {
        const res = await fetch("data/stories.json?t=" + Date.now());
        if (!res.ok) throw new Error("Fetch failed");
        const data = await res.json();
        // Filter to only riddles
        allRiddles = (data.stories || []).filter(s => s.type === "riddle");
      } catch (e) {
        console.warn("Could not load riddles:", e);
        allRiddles = [];
      }
      renderFilter();
      renderGrid();
    }

    function renderFilter() {
      const wrap = document.getElementById("classFilter");
      wrap.innerHTML = "";
      CLASSES.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "class-chip" + (c.id === activeFilter ? " active" : "");
        btn.textContent = c.label;
        btn.onclick = () => {
          activeFilter = c.id;
          renderFilter();
          renderGrid();
        };
        wrap.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById("riddleGrid");
      grid.innerHTML = "";

      let filtered = allRiddles;
      if (activeFilter !== "all") {
        filtered = allRiddles.filter(r => r.class && r.class.includes(activeFilter));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.6);grid-column:1/-1;padding:40px;">No riddles for this class yet.</p>';
        return;
      }

      filtered.forEach(riddle => {
        const card = document.createElement("div");
        card.className = "riddle-card";
        card.onclick = () => openRiddle(riddle);

        const classTags = (riddle.class || []).map(c => `<span class="riddle-class-tag">${c.toUpperCase()}</span>`).join("");

        card.innerHTML = `
          <div class="riddle-icon">🧩</div>
          <div class="riddle-title">${riddle.title}</div>
          <div class="riddle-meta"><span>⏱ ${riddle.duration || '1 min'}</span> ${classTags}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openRiddle(riddle) {
      currentRiddle = riddle;
      document.getElementById("viewerQuestion").textContent = riddle.content[0];
      document.getElementById("viewerAnswer").textContent = riddle.content[1] || "Answer not available.";
      document.getElementById("viewerAnswer").classList.remove("show");
      document.getElementById("revealBtn").style.display = "inline-block";
      document.getElementById("riddleViewer").classList.add("open");
    }

    function revealAnswer() {
      document.getElementById("viewerAnswer").classList.add("show");
      document.getElementById("revealBtn").style.display = "none";
    }

    function closeRiddle() {
      document.getElementById("riddleViewer").classList.remove("open");
    }

    loadRiddles();
  </script>
</body>
</html>
