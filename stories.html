<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Time — Study Hub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .story-hero { padding: 60px 20px 30px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.15), transparent 60%); }
    .story-hero .story-badge { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(250,204,21,0.2); border: 1px solid rgba(250,204,21,0.4); color: #facc15; font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
    .story-hero h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 12px; line-height: 1.15; }
    .story-hero p { font-size: 1.05rem; color: rgba(255,255,255,0.75); max-width: 600px; margin: 0 auto; line-height: 1.6; }
    .story-grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    @media (min-width: 600px) { .story-grid { grid-template-columns: 1fr 1fr; } }
    .story-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 24px; cursor: pointer; transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column; }
    .story-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.1); border-color: #3b82f6; }
    .story-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .story-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .story-desc { font-size: 0.9rem; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 16px; flex: 1; }
    .story-meta { font-size: 0.8rem; color: rgba(255,255,255,0.5); display: flex; gap: 12px; }
    
    .story-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 200; display: none; overflow-y: auto; padding: 20px 0; }
    .story-viewer.open { display: block; }
    .story-viewer-card { background: linear-gradient(135deg, #1e3a8a, #0f172a); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; max-width: 700px; margin: 0 auto; padding: 30px; position: relative; }
    .story-viewer-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    .story-viewer-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; }
    .story-viewer-meta { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 24px; display: flex; gap: 12px; }
    .story-text { font-family: Georgia, serif; font-size: 1.1rem; line-height: 1.8; color: rgba(255,255,255,0.92); }
    .story-text p { margin-bottom: 18px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="profile-picker.html" class="site-logo">
        <span class="site-logo-icon">📚</span>
        <span class="site-logo-text"><strong>Study Hub</strong><small>Story Time</small></span>
      </a>
      <div class="site-header-actions"><a href="profile-picker.html" class="site-header-cta">← Home</a></div>
    </div>
  </header>

  <section class="story-hero">
    <div class="story-badge">📖 Story Time</div>
    <h1>Stories for Everyone</h1>
    <p>Read, listen, and enjoy stories chosen for your class. From folktales to adventures — there's something for every young reader.</p>
  </section>

  <main>
    <div class="story-grid" id="storyGrid"></div>
  </main>

  <div class="story-viewer" id="storyViewer">
    <div class="story-viewer-card">
      <button class="story-viewer-close" onclick="closeStory()">✕</button>
      <h2 class="story-viewer-title" id="viewerTitle"></h2>
      <div class="story-viewer-meta" id="viewerMeta"></div>
      <div class="story-text" id="viewerText"></div>
    </div>
  </div>

  <script>
    let allStories = [];

    // Fallback data in case the JSON fails to load
    const fallback = [
      { title: "The Tortoise and His Friends", author: "Traditional", duration: "3 min", content: ["Kwaku the tortoise found a mango tree.", "His friend Ama the ant helped him reach the fruit.", "They shared the mango and became best friends.", "Moral: Even the smallest friend can help."] },
      { title: "Anansi and the Pot of Wisdom", author: "Ghanaian Folktale", duration: "6 min", content: ["Anansi the spider kept all wisdom in a pot.", "He tried to hide it at the top of a tree.", "His son Ntikuma gave him better advice.", "The pot broke and wisdom spread across the land."] }
    ];

    async function loadStories() {
      try {
        const res = await fetch("data/stories.json?t=" + Date.now());
        if (!res.ok) throw new Error("Fetch failed");
        const data = await res.json();
        allStories = data.stories;
      } catch (e) {
        console.warn("Using fallback stories:", e);
        allStories = fallback;
      }
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById("storyGrid");
      grid.innerHTML = "";
      allStories.forEach((story, i) => {
        const card = document.createElement("div");
        card.className = "story-card";
        card.onclick = () => openStory(i);
        card.innerHTML = `
          <div class="story-icon">📖</div>
          <div class="story-title">${story.title}</div>
          <div class="story-desc">${story.description || story.content[0].substring(0, 80) + '...'}</div>
          <div class="story-meta"><span>✍ ${story.author || 'Unknown'}</span><span>⏱ ${story.duration || ''}</span></div>
        `;
        grid.appendChild(card);
      });
    }

    function openStory(i) {
      const story = allStories[i];
      document.getElementById("viewerTitle").textContent = story.title;
      document.getElementById("viewerMeta").innerHTML = `<span>✍ ${story.author || 'Unknown'}</span><span>⏱ ${story.duration || ''}</span>`;
      
      const textBox = document.getElementById("viewerText");
      textBox.innerHTML = "";
      story.content.forEach(p => {
        const el = document.createElement("p");
        el.textContent = p;
        textBox.appendChild(el);
      });
      
      document.getElementById("storyViewer").classList.add("open");
    }

    function closeStory() {
      document.getElementById("storyViewer").classList.remove("open");
    }

    loadStories();
  </script>
</body>
</html>
