<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Time — Study Hub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .story-hero { padding: 60px 20px 30px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.15), transparent 60%); }
    .story-hero .story-badge { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(250,204,21,0.2); border: 1px solid rgba(250,204,21,0.4); color: #facc15; font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
    .story-hero h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 12px; line-height: 1.15; }
    .story-hero p { font-size: 1.05rem; color: rgba(255,255,255,0.75); max-width: 600px; margin: 0 auto; line-height: 1.6; }

    /* Class Filter */
    .class-filter { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 20px; max-width: 900px; margin: 0 auto; }
    .class-chip { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .class-chip:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); }
    .class-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Story Grid */
    .story-grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 20px; }
    @media (min-width: 600px) { .story-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 900px) { .story-grid { grid-template-columns: 1fr 1fr 1fr; } }

    .story-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 20px; cursor: pointer; transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column; }
    .story-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .story-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .story-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .story-desc { font-size: 0.85rem; color: rgba(255,255,255,0.65); line-height: 1.5; margin-bottom: 12px; flex: 1; }
    .story-meta { font-size: 0.75rem; color: rgba(255,255,255,0.55); display: flex; gap: 10px; margin-top: auto; flex-wrap: wrap; }
    .story-meta span { background: rgba(255,255,255,0.06); padding: 3px 8px; border-radius: 6px; }
    .story-class-tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; background: rgba(250,204,21,0.15); color: #facc15; font-weight: 700; text-transform: uppercase; margin-left: 4px; }

    /* Viewer */
    .story-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 200; display: none; overflow-y: auto; padding: 20px 0; }
    .story-viewer.open { display: block; }
    .story-viewer-card { background: linear-gradient(135deg, #1e3a8a, #0f172a); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; max-width: 700px; margin: 0 auto; padding: 30px; position: relative; }
    .story-viewer-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    .story-viewer-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; }
    .story-viewer-meta { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 24px; display: flex; gap: 12px; }
    .story-text { font-family: Georgia, serif; font-size: 1.1rem; line-height: 1.8; color: rgba(255,255,255,0.92); }
    .story-text p { margin-bottom: 18px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="profile-picker.html" class="site-logo">
        <span class="site-logo-icon">📚</span>
        <span class="site-logo-text"><strong>Study Hub</strong><small>Story Time</small></span>
      </a>
      <div class="site-header-actions"><a href="profile-picker.html" class="site-header-cta">← Home</a></div>
    </div>
  </header>

  <section class="story-hero">
    <div class="story-badge">📖 Story Time</div>
    <h1>Stories for Everyone</h1>
    <p>Read, listen, and enjoy stories chosen for your class. From folktales to adventures — there's something for every young reader.</p>
  </section>

  <!-- Class Filter -->
  <div class="class-filter" id="classFilter"></div>

  <main>
    <div class="story-grid" id="storyGrid"></div>
  </main>

  <div class="story-viewer" id="storyViewer">
    <div class="story-viewer-card">
      <button class="story-viewer-close" onclick="closeStory()">✕</button>
      <h2 class="story-viewer-title" id="viewerTitle"></h2>
      <div class="story-viewer-meta" id="viewerMeta"></div>
      <div class="story-text" id="viewerText"></div>
    </div>
  </div>

  <script>
    const CLASSES = [
      { id: "all", label: "All" },
      { id: "p1", label: "P1" },
      { id: "p2", label: "P2" },
      { id: "p3", label: "P3" },
      { id: "p4", label: "P4" },
      { id: "p5", label: "P5" },
      { id: "p6", label: "P6" },
      { id: "jhs1", label: "JHS 1" },
      { id: "jhs2", label: "JHS 2" },
      { id: "jhs3", label: "JHS 3" }
    ];

    let allStories = [];
    let activeFilter = "all";

    const fallback = [
      { title: "The Tortoise and His Friends", class: ["p1","p2","p3"], author: "Traditional", duration: "3 min", content: ["Kwaku the tortoise found a mango tree.", "His friend Ama the ant helped him reach the fruit.", "They shared the mango and became best friends.", "Moral: Even the smallest friend can help."] },
      { title: "Anansi and the Pot of Wisdom", class: ["p4","p5","p6"], author: "Ghanaian Folktale", duration: "6 min", content: ["Anansi the spider kept all wisdom in a pot.", "He tried to hide it at the top of a tree.", "His son Ntikuma gave him better advice.", "The pot broke and wisdom spread across the land."] }
    ];

    async function loadStories() {
      try {
        const res = await fetch("data/stories.json?t=" + Date.now());
        if (!res.ok) throw new Error("Fetch failed");
        const data = await res.json();
        allStories = data.stories;
      } catch (e) {
        console.warn("Using fallback stories:", e);
        allStories = fallback;
      }
      renderFilter();
      renderGrid();
    }

    function renderFilter() {
      const wrap = document.getElementById("classFilter");
      wrap.innerHTML = "";
      CLASSES.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "class-chip" + (c.id === activeFilter ? " active" : "");
        btn.textContent = c.label;
        btn.onclick = () => {
          activeFilter = c.id;
          renderFilter();
          renderGrid();
        };
        wrap.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById("storyGrid");
      grid.innerHTML = "";
      
      let filtered = allStories;
      if (activeFilter === "riddles") {
        filtered = allStories.filter(s => s.type === "riddle");
      } else if (activeFilter !== "all") {
        filtered = allStories.filter(s => s.class && s.class.includes(activeFilter));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.6);grid-column:1/-1;padding:40px;">No stories for this class yet. Check back soon!</p>';
        return;
      }

      filtered.forEach((story, i) => {
        const card = document.createElement("div");
        card.className = "story-card";
        const globalIndex = allStories.indexOf(story);
        card.onclick = () => openStory(globalIndex);
        
        const classTags = (story.class || []).map(c => `<span class="story-class-tag">${c.toUpperCase()}</span>`).join("");

        card.innerHTML = `
          <div class="story-icon">📖</div>
          <div class="story-title">${story.title} ${classTags}</div>
          <div class="story-desc">${story.description || (story.content[0] ? story.content[0].substring(0, 80) + '...' : '')}</div>
          <div class="story-meta"><span>✍ ${story.author || 'Unknown'}</span><span>⏱ ${story.duration || ''}</span></div>
        `;
        grid.appendChild(card);
      });
    }

    function openStory(i) {
      const story = allStories[i];
      document.getElementById("viewerTitle").textContent = story.title;
      document.getElementById("viewerMeta").innerHTML = `<span>✍ ${story.author || 'Unknown'}</span><span>⏱ ${story.duration || ''}</span>`;
      
      const textBox = document.getElementById("viewerText");
      textBox.innerHTML = "";
      story.content.forEach(p => {
        const el = document.createElement("p");
        el.textContent = p;
        textBox.appendChild(el);
      });
      
      document.getElementById("storyViewer").classList.add("open");
    }

    function closeStory() {
      document.getElementById("storyViewer").classList.remove("open");
    }

    loadStories();
  </script>
</body>
</html>
