<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Time — Study Hub</title>
  <link rel="icon" type="image/png" href="assets/immanuel.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .story-hero { padding: 60px 20px 30px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.15), transparent 60%); }
    .story-hero .story-badge { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(250,204,21,0.2); border: 1px solid rgba(250,204,21,0.4); color: #facc15; font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
    .story-hero h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 12px; line-height: 1.15; }
    .story-hero p { font-size: 1.05rem; color: rgba(255,255,255,0.75); max-width: 600px; margin: 0 auto; line-height: 1.6; }

    .class-filter { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 20px; max-width: 900px; margin: 0 auto; }
    .class-chip { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .class-chip:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); }
    .class-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .story-grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 20px; }
    @media (min-width: 600px) { .story-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 900px) { .story-grid { grid-template-columns: 1fr 1fr 1fr; } }

    .story-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
    .story-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }

    .story-cover { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .story-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .story-cover-fallback { font-size: 4rem; opacity: 0.7; }

    .story-type-badge { position: absolute; top: 10px; right: 10px; padding: 5px 12px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(0,0,0,0.65); color: #fff; backdrop-filter: blur(6px); }
    .story-type-badge.text { background: rgba(59,130,246,0.85); }
    .story-type-badge.audio { background: rgba(168,85,247,0.85); }
    .story-type-badge.video { background: rgba(220,38,38,0.85); }

    .story-info { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
    .story-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .story-desc { font-size: 0.85rem; color: rgba(255,255,255,0.65); line-height: 1.5; margin-bottom: 12px; flex: 1; }
    .story-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: auto; }
    .story-meta span { padding: 3px 8px; background: rgba(255,255,255,0.06); border-radius: 6px; }
    .story-classes { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
    .story-class-tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 6px; background: rgba(250,204,21,0.15); color: #facc15; font-weight: 700; text-transform: uppercase; }

    /* ==== VIEWER ==== */
    .story-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 200; display: none; overflow-y: auto; padding: 20px 0; }
    .story-viewer.open { display: block; }
    .story-viewer-card { background: linear-gradient(135deg, var(--bg-1), var(--bg-2)); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; max-width: 800px; margin: 0 auto; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .story-viewer-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; background: rgba(15,23,42,0.95); backdrop-filter: blur(8px); z-index: 5; }
    .story-viewer-close { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 1.1rem; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-family: inherit; }
    .story-viewer-close:hover { background: rgba(255,255,255,0.18); }
    .story-viewer-type { font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #facc15; }
    .story-viewer-body { padding: 30px 24px 40px; }
    .story-viewer-title { font-size: 1.8rem; font-weight: 800; line-height: 1.2; margin-bottom: 10px; }
    .story-viewer-meta { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 12px; }

    .story-text { font-family: Georgia, "Times New Roman", serif; font-size: 1.15rem; line-height: 1.9; color: rgba(255,255,255,0.92); }
    .story-text p { margin-bottom: 20px; }
    .story-text p:first-of-type::first-letter { font-size: 3.2rem; font-weight: 700; float: left; line-height: 0.9; margin: 6px 10px 0 0; color: #facc15; }

    /* ==== STORY TABS (Read / Quiz / Puzzle) ==== */
    .story-tabs {
      display: flex;
      gap: 6px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      flex-wrap: wrap;
    }
    .story-tab {
      flex: 1;
      min-width: 100px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .story-tab:hover { background: rgba(255,255,255,0.1); }
    .story-tab.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

    .story-tab-panel { display: none; margin-top: 22px; animation: fadeIn 0.25s ease; }
    .story-tab-panel.active { display: block; }

    /* ==== QUIZ ==== */
    .story-quiz-q { margin-bottom: 24px; }
    .story-quiz-q-num {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #facc15;
      margin-bottom: 8px;
    }
    .story-quiz-q-text {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .story-quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .story-quiz-option {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.1);
      color: #fff;
      text-align: left;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .story-quiz-option:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
    .story-quiz-option:disabled { cursor: default; }
    .story-quiz-option.correct { background: rgba(16,185,129,0.2); border-color: #34d399; color: #fff; }
    .story-quiz-option.wrong { background: rgba(220,38,38,0.2); border-color: #f87171; color: #fff; }

    .story-quiz-result {
      margin-top: 24px;
      padding: 18px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.35);
      border-radius: 14px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
    }

    /* ==== PUZZLE (Jumbled) ==== */
    .puzzle-prompt { font-size: 0.95rem; color: rgba(255,255,255,0.75); margin-bottom: 20px; line-height: 1.5; }

    .jumbled-list { display: flex; flex-direction: column; gap: 14px; }
    .jumbled-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .jumbled-word {
      font-family: "Consolas", "Monaco", monospace;
      font-size: 1
