<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timetable — Study Hub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .tt-hero { padding: 60px 20px 30px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(59,130,246,0.15), transparent 60%); }
    .tt-hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
    .tt-hero p { color: rgba(255,255,255,0.7); max-width: 560px; margin: 0 auto; line-height: 1.6; }
    .tt-wrap { max-width: 1200px; margin: 0 auto; padding: 20px; overflow-x: auto; }
    .tt-table { width: 100%; border-collapse: separate; border-spacing: 6px; min-width: 720px; }
    .tt-table th { background: rgba(59,130,246,0.2); color: #93c5fd; padding: 10px; border-radius: 10px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .tt-table td { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; vertical-align: top; min-width: 150px; }
    .tt-table td.empty { background: rgba(255,255,255,0.02); border-style: dashed; text-align: center; color: rgba(255,255,255,0.3); }
    .tt-subject { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .tt-teacher { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
    .tt-time { font-size: 0.7rem; color: rgba(147,197,253,0.85); margin-top: 4px; }
    .tt-room { font-size: 0.7rem; color: rgba(250,204,21,0.8); margin-top: 2px; }
    .tt-loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); }
    .tt-error { text-align: center; padding: 40px 20px; color: #fca5a5; background: rgba(239,68,68,0.1); border-radius: 16px; max-width: 600px; margin: 20px auto; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="profile-picker.html" class="site-logo">
        <span class="site-logo-icon">📚</span>
        <span class="site-logo-text"><strong>Study Hub</strong><small>Timetable</small></span>
      </a>
      <div class="site-header-actions"><a href="profile-picker.html" class="site-header-cta">← Home</a></div>
    </div>
  </header>

  <section class="tt-hero">
    <h1>📅 Class Timetable</h1>
    <p id="ttClassLabel">Loading your timetable…</p>
  </section>

  <div class="tt-wrap" id="ttWrap">
    <div class="tt-loading">Fetching timetable from Google Sheets…</div>
  </div>

  <script>
    
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSPWBMhhCza3JlROT6PwC1NXgpM6v5YHDPsV7qnyFjH0nkBLNKmPYqT9xivM_E7MUx54-Mz8PS-j3X8/pub?output=csv";

    const params = new URLSearchParams(window.location.search);
    const activeClass = (params.get("class") || "p5").toLowerCase();
    const classLabels = { p1:"P1", p2:"P2", p3:"P3", p4:"P4", p5:"P5", p6:"P6", jhs1:"JHS 1", jhs2:"JHS 2", jhs3:"JHS 3" };
    document.getElementById("ttClassLabel").textContent = "Showing: " + (classLabels[activeClass] || activeClass.toUpperCase());

    const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
    const PERIODS = ["1","2","3","4","5","6"]; // Now a string to match teacher input

    function parseCSVLine(line) {
      const out = []; let cur = ""; let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; continue; }
        if (ch === ',' && !inQ) { out.push(cur); cur = ""; continue; }
        cur += ch;
      }
      out.push(cur);
      return out.map(s => s.trim());
    }

    function parseCSV(text) {
      return text.replace(/\r/g, "").split("\n").filter(l => l.trim() !== "").map(parseCSVLine);
    }

    function findHeaderRow(rows) {
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].map(c => c.toLowerCase());
        if (r.includes("day") && r.includes("period") && r.includes("subject")) return i;
      }
      return -1;
    }

    async function loadTimetable() {
      const wrap = document.getElementById("ttWrap");
      try {
        const res = await fetch(CSV_URL + "&t=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        const hi = findHeaderRow(rows);
        if (hi < 0) throw new Error("Header row not found");

        const headers = rows[hi].map(h => h.toLowerCase());
        
        // Bulletproof column finding (ignoring empty trailing commas)
        const idx = {
          day: headers.findIndex(h => h.includes("day")),
          period: headers.findIndex(h => h.includes("period")),
          start: headers.findIndex(h => h.includes("start")),
          end: headers.findIndex(h => h.includes("end")),
          subject: headers.findIndex(h => h.includes("subject")),
          teacher: headers.findIndex(h => h.includes("teacher")),
          cls: headers.findIndex(h => h.includes("class")),
          room: headers.findIndex(h => h.includes("room"))
        };

        if (idx.day < 0 || idx.subject < 0 || idx.cls < 0) throw new Error("Required columns missing");

        // Filter by class (using .includes to catch accidental spaces)
        const classRows = rows.slice(hi + 1).filter(r => {
          const rowClass = (r[idx.cls] || "").toLowerCase().trim();
          return rowClass === activeClass;
        });

        if (classRows.length === 0) {
          wrap.innerHTML = '<div class="tt-error">No timetable found for ' + (classLabels[activeClass] || activeClass.toUpperCase()) + '.<br><small>Make sure the teacher saved it in the portal.</small></div>';
          return;
        }

        const lookup = {};
        classRows.forEach(r => {
          const day = (r[idx.day] || "").trim();
          let per = (r[idx.period] || "").toString().replace(/[^0-9]/g, ''); // Extract just the number
          if (!day || !per) return;
          if (!lookup[day]) lookup[day] = {};
          lookup[day][per] = {
            subject: r[idx.subject] || "",
            teacher: r[idx.teacher] || "",
            room: r[idx.room] || "",
            start: r[idx.start] || "",
            end: r[idx.end] || ""
          };
        });

        let html = '<table class="tt-table"><thead><tr><th>Period</th>';
        DAYS.forEach(d => { html += '<th>' + d + '</th>'; });
        html += '</tr></thead><tbody>';
        
        PERIODS.forEach(p => {
          html += '<tr><th>P' + p + '</th>';
          DAYS.forEach(d => {
            const cell = (lookup[d] && lookup[d][p]) ? lookup[d][p] : null;
            if (cell) {
              const timeStr = (cell.start && cell.end) ? cell.start + " - " + cell.end : "";
              html += '<td><div class="tt-subject">' + cell.subject + '</div>' +
                (timeStr ? '<div class="tt-time">🕐 ' + timeStr + '</div>' : '') +
                (cell.teacher ? '<div class="tt-teacher">👤 ' + cell.teacher + '</div>' : '') +
                (cell.room ? '<div class="tt-room">📍 ' + cell.room + '</div>' : '') +
                '</td>';
            } else {
              html += '<td class="empty">—</td>';
            }
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
      } catch (err) {
        console.error(err);
        wrap.innerHTML = '<div class="tt-error">⚠️ Could not load timetable.<br><small>' + err.message + '</small></div>';
      }
    }
    loadTimetable();

  </script>
</body>
</html>
