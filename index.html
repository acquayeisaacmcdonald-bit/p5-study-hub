<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard & Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>📚 Study Buddy</h1>
      <div class="tabs">
        <button class="tab active" data-tab="study">Study</button>
        <button class="tab" data-tab="quiz">Quiz</button>
        <button class="tab" data-tab="manage">Manage</button>
        <button class="tab" data-tab="stats">Stats</button>
      </div>
    </header>

    <!-- ===== STUDY TAB ===== -->
    <section class="tab-panel active" id="study">
      <div class="filters">
        <select id="studyCategory">
          <option value="all">All categories</option>
        </select>
        <select id="studyDifficulty">
          <option value="all">All difficulties</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="card-container">
        <div class="card" id="card">
          <div class="card-face card-front">
            <span class="badge" id="frontBadge"></span>
            <p id="question">Question goes here</p>
          </div>
          <div class="card-face card-back">
            <span class="badge" id="backBadge"></span>
            <p id="answer">Answer goes here</p>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn">◀ Prev</button>
        <button id="flipBtn">Flip</button>
        <button id="nextBtn">Next ▶</button>
      </div>

      <p class="progress" id="progress">Card 1 of 1</p>
    </section>

    <!-- ===== QUIZ TAB ===== -->
    <section class="tab-panel" id="quiz">
      <div id="quizSetup">
        <h2>Quiz Setup</h2>
        <label>Category
          <select id="quizCategory">
            <option value="all">All categories</option>
          </select>
        </label>
        <label>Difficulty
          <select id="quizDifficulty">
            <option value="all">All difficulties</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label>Number of questions
          <input type="number" id="quizLength" value="5" min="1" max="50" />
        </label>
        <button id="startQuizBtn">Start Quiz</button>
      </div>

      <div id="quizPlay" class="hidden">
        <p class="progress" id="quizProgress">Question 1 of 5</p>
        <div class="quiz-question" id="quizQuestion">Question</div>
        <div class="quiz-options" id="quizOptions"></div>
        <p class="quiz-feedback" id="quizFeedback"></p>
      </div>

      <div id="quizResult" class="hidden">
        <h2>🎉 Quiz Complete!</h2>
        <p class="score" id="finalScore">You scored 0 / 0</p>
        <p id="scoreMessage"></p>
        <button id="restartQuizBtn">Take Another Quiz</button>
      </div>
    </section>

    <!-- ===== MANAGE TAB ===== -->
    <section class="tab-panel" id="manage">
      <h2>Add a Card</h2>
      <form id="addCardForm">
        <label>Question
          <input type="text" id="newQuestion" required />
        </label>
        <label>Answer
          <input type="text" id="newAnswer" required />
        </label>
        <label>Category
          <input type="text" id="newCategory" placeholder="e.g. Math, Science" required />
        </label>
        <label>Difficulty
          <select id="newDifficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <button type="submit">Add Card</button>
      </form>

      <h2>Your Cards (<span id="cardCount">0</span>)</h2>
      <div class="card-list" id="cardList"></div>

      <button id="resetBtn" class="danger">Reset to Default Cards</button>
    </section>

    <!-- ===== STATS TAB ===== -->
    <section class="tab-panel" id="stats">
      <h2>📊 Your Progress</h2>
      <div class="stat-grid">
        <div class="stat">
          <span class="stat-value" id="statTotalCards">0</span>
          <span class="stat-label">Total Cards</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statQuizzes">0</span>
          <span class="stat-label">Quizzes Taken</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statBest">0%</span>
          <span class="stat-label">Best Score</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statAvg">0%</span>
          <span class="stat-label">Average Score</span>
        </div>
      </div>

      <h3>Recent Quizzes</h3>
      <ul class="history" id="quizHistory"></ul>

      <button id="clearHistoryBtn" class="danger">Clear History</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
